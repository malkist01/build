name: Normal

on:
  workflow_dispatch:
    inputs:
      device:
          description: 'Device'
          default: 'ginkgo'
          required: true

env:
  TZ: Asia/Jakarta
  DEVICE: ${{ github.event.inputs.device }}

jobs:
  kernel-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Compiling
        run: |
          if [ "${DEVICE}" = "ginkgo" ]; then
            wget https://raw.githubusercontent.com/malkist01/build/main/scripts/ging.sh
            bash ging.sh
          else
            echo "Device not supported yet"
          fi
